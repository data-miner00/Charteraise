# Node.js with Angular
# Build a Node.js project that uses Angular.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
  - master

pool: default

steps:
  - task: CmdLine@2
    inputs:
      script: |
        echo  'Default Working Directory: $(System.DefaultWorkingDirectory)'
        echo  'Pipeline Workspace: $(Pipeline.Workspace)'
        dir
    displayName: Show working directory

  - task: UseNode@1
    inputs:
      version: '22.x'
    displayName: 'Install Node.js'

  - script: |
      npm ci --legacy-peer-deps
    displayName: 'Install dependencies'

  - script: |
      npm run test:headless
    displayName: 'Run headless unit tests'

  - script: |
      npm run build
    displayName: 'Build for production'

  - task: CopyFiles@2
    inputs:
      SourceFolder: 'dist/charteraise/browser'
      Contents: '**/*'
      TargetFolder: drop
    displayName: 'Copy files to drop folder'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact: drop'
    inputs:
      PathtoPublish: drop
