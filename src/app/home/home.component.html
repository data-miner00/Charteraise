<div class="flex gap-12">
  <div class="stats shadow mb-4">
    <div class="stat">
      <div class="stat-figure text-primary">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          class="inline-block h-8 w-8 stroke-current"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
          ></path>
        </svg>
      </div>
      <div class="stat-title">Total Containers</div>
      <div class="stat-value text-primary">301</div>
      <div class="stat-desc">21% more than last month</div>
    </div>

    <div class="stat">
      <div class="stat-figure text-secondary">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          class="inline-block h-8 w-8 stroke-current"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 10V3L4 14h7v7l9-11h-7z"
          ></path>
        </svg>
      </div>
      <div class="stat-title">Requests</div>
      <div class="stat-value text-secondary">2.6M</div>
      <div class="stat-desc">21% more than last month</div>
    </div>

    <div class="stat">
      <div class="stat-figure text-secondary">
        <div class="avatar online">
          <div class="w-16 rounded-full">
            <img
              src="https://img.daisyui.com/images/stock/photo-1534528741775-53994a69daeb.webp"
            />
          </div>
        </div>
      </div>
      <div class="stat-value">86%</div>
      <div class="stat-title">Tasks done</div>
      <div class="stat-desc text-secondary">31 tasks remaining</div>
    </div>
  </div>

  <p>SSL Expiration</p>
  <div class="grid auto-cols-max grid-flow-col gap-5 text-center">
    <div class="flex flex-col">
      <span class="countdown font-mono text-5xl">
        <span style="--value: 15" aria-live="polite" aria-label="15">15</span>
      </span>
      days
    </div>
    <div class="flex flex-col">
      <span class="countdown font-mono text-5xl">
        <span style="--value: 10" aria-live="polite" aria-label="10">10</span>
      </span>
      hours
    </div>
    <div class="flex flex-col">
      <span class="countdown font-mono text-5xl">
        <span style="--value: 24" aria-live="polite" aria-label="24">24</span>
      </span>
      min
    </div>
    <div class="flex flex-col">
      <span class="countdown font-mono text-5xl">
        <span style="--value: 59" aria-live="polite" aria-label="59">59</span>
      </span>
      sec
    </div>
  </div>
</div>

<div class="grid grid-cols-3 gap-4">
  <google-chart
    [type]="type"
    title="Network Throughput"
    [data]="data"
    [columns]="columns"
    [options]="options"
  ></google-chart>

  <google-chart
    [type]="candleStickType"
    title="BTC Price"
    [data]="candleStickData"
    [options]="options"
  ></google-chart>

  <google-chart
    [type]="pieChartType"
    title="Disk Usage"
    [data]="pieChartData"
    [options]="pieChartOptions"
  >
  </google-chart>

  <google-chart
    [type]="lineChartType"
    title="Memory and CPU Usage"
    [data]="cpuMemoryData"
    [columns]="cpuMemoryColumns"
    [options]="cpuMemoryOptions"
  ></google-chart>

  <google-chart
    [type]="pieChartType"
    title="Container Status"
    [data]="containerStatusData"
    [options]="containerStatusOptions"
  ></google-chart>

  <div class="col-span-3">
    <google-chart
      [type]="geoChartType"
      title="Requests from different countries"
      [data]="geoChartData"
      [columns]="geoChartColumns"
      [options]="geoChartOptions"
    ></google-chart>
  </div>
</div>
